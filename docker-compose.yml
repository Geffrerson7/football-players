# Postgres solo para desarrollo local. En producción se usa Neon.
# Misma versión mayor que la base original de Supabase (PostgreSQL 17).
#
# No requiere ninguna variable de entorno ni guarda contraseñas en el repo:
# al crear la base por primera vez se usa autenticación "trust" (sin contraseña),
# y el puerto solo se publica en 127.0.0.1, así que solo es accesible desde tu equipo.
# Si el volumen ya existía, Postgres conserva la configuración con la que se creó.
services:
  db:
    image: postgres:17-alpine
    container_name: football-players-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: football
      POSTGRES_DB: football_players
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
